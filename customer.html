<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>バイク王車検 概算シミュレーター</title>
<style>
:root{
  --bg:#eceef2;--card:#fff;--ink:#14171f;--sub:#5b6474;--line:#dfe3ea;
  --brand:#e60012;--brand-d:#b8000e;--accent:#14171f;--ok:#12a150;--gold:#f5b301;
  --eco:#4e9a3c;--std:#2a7aa3;--pre:#e60012;
  --r:20px;
}
*{box-sizing:border-box;margin:0}
html{font-size:20px}
body{font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;background:var(--bg);color:var(--ink);font-size:1rem;line-height:1.6;-webkit-tap-highlight-color:transparent}
header{background:var(--accent);color:#fff;padding:0 24px;min-height:68px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:5;border-bottom:5px solid var(--brand)}
header h1{font-size:1.15rem;flex:1;cursor:pointer;letter-spacing:.02em}
header h1{display:flex;align-items:center}
header h1 img{height:52px;background:#fff;border-radius:8px;padding:3px 10px;margin-right:16px}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;padding:0 20px;min-height:48px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit}
header button#homeBtn{background:var(--brand)}
header button.on{background:var(--gold);color:#222}
main{max-width:1280px;margin:0 auto;padding:28px 28px 90px}
.hero{display:block;width:100%;border-radius:var(--r);margin-bottom:26px;box-shadow:0 4px 16px rgba(20,30,50,.18)}
h2{font-size:1.6rem;margin-bottom:6px;padding-left:14px;border-left:8px solid var(--brand);line-height:1.35}
.lead{color:var(--sub);margin-bottom:22px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 2px 10px rgba(20,30,50,.07);overflow:hidden}
.tile{cursor:pointer;border:3px solid transparent;transition:.15s;text-align:left;font:inherit;color:inherit;padding:0;background:var(--card);border-radius:var(--r);box-shadow:0 2px 10px rgba(20,30,50,.07);overflow:hidden}
.tile .pic{background:linear-gradient(135deg,#14171f,#3a3f4b);border-bottom:6px solid var(--brand);height:150px}
.tile:hover,.tile:active{border-color:var(--brand);transform:translateY(-2px)}
.pic{height:130px;display:flex;align-items:center;justify-content:center;font-size:64px;background:linear-gradient(135deg,#243b5a,#3f6aa3);color:#fff;position:relative}
.pic img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.pic.sm{height:90px;font-size:44px}
.pic.eco{background:linear-gradient(135deg,#3e7d30,#6bbd57)}
.pic.std{background:linear-gradient(135deg,#1d5e80,#4aa3cf)}
.pic.pre{background:linear-gradient(135deg,#a01218,#e8545a)}
.body{padding:16px 18px 18px}
.body h3{font-size:21px;margin-bottom:4px}
.muted{color:var(--sub);font-size:15px}
.soon{opacity:.5;cursor:not-allowed}
.soon:hover{border-color:transparent;transform:none}
/* flow chart */
.flow{display:flex;align-items:center;gap:6px;margin-bottom:26px;flex-wrap:wrap}
.node{padding:8px 14px;border-radius:999px;background:#dde2ea;color:#667085;font-size:14px;font-weight:700}
.node.done{background:var(--accent);color:#fff}
.node.now{background:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(216,35,42,.2)}
.arrow{color:#aab2c0}
.opt{width:100%;text-align:left;font:inherit;color:inherit;background:var(--card);border:3px solid var(--line);border-radius:var(--r);padding:20px 26px;min-height:88px;cursor:pointer;font-size:1.1rem;font-weight:700;transition:.15s;display:flex;gap:18px;align-items:center}
.opt:hover,.opt:active{border-color:var(--brand);background:#fff3f3}
.opt .ic{font-size:2.2rem}
.opt small{display:block;font-weight:400;color:var(--sub);font-size:.8rem}
.vg{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
@media (max-width:900px){.vg{grid-template-columns:repeat(2,1fr)}}
.vcard{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:0 2px 10px rgba(20,30,50,.07);display:flex;flex-direction:column}
.vhead{background:linear-gradient(135deg,#14171f,#3a3f4b);color:#fff;display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:5px solid var(--brand)}
.vhead b{font-size:1.1rem;line-height:1.3}
.vhead svg{width:104px;height:52px;flex:none;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.vhead svg .ac{fill:var(--brand);stroke:none}
.vbtns{padding:14px;display:grid;gap:10px;flex:1;align-content:start}
.gopt{min-height:68px;padding:12px 18px;font-size:1rem;border-radius:14px}
.gopt .gb{width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.gopt .chev{color:var(--brand);font-size:1.6rem;font-weight:900}
.gopt:hover .gb{background:var(--brand)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:16px;padding:0 36px;min-height:64px;font-size:1.05rem;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 var(--brand-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-d)}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:#fff;color:var(--accent);border:3px solid var(--accent);box-shadow:none}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:26px}
.back{background:#fff;border:2px solid var(--line);border-radius:14px;color:var(--sub);font-size:.9rem;font-weight:700;min-height:52px;padding:0 24px;cursor:pointer;margin-top:22px;font-family:inherit}
.chip{display:inline-block;background:#e9edf3;border-radius:999px;padding:4px 14px;font-size:15px;font-weight:700;margin:0 6px 10px 0}
/* plans */
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
@media (max-width:900px){.plans{grid-template-columns:1fr}}
.plan{position:relative;display:flex;flex-direction:column;border:3px solid var(--line);background:#fff;border-radius:var(--r);overflow:hidden}
.plan.rec{border-color:var(--brand);box-shadow:0 8px 28px rgba(216,35,42,.25);transform:scale(1.02)}
.badge{position:absolute;top:12px;left:12px;background:var(--brand);color:#fff;border-radius:999px;padding:4px 14px;font-size:14px;font-weight:800;z-index:2}
.plan .price{font-size:34px;font-weight:800;line-height:1.2;margin-top:6px}
.plan .price small{font-size:15px;font-weight:500;color:var(--sub)}
.plan .brk{font-size:14px;color:var(--sub);margin-bottom:6px}
.plan ul{list-style:none;padding:0;margin:12px 0;flex:1}
.plan li{padding:6px 0 6px 28px;position:relative;border-bottom:1px dashed var(--line);font-size:16px}
.plan li::before{content:"✔";position:absolute;left:4px;color:var(--ok);font-weight:800}
.plan li.no{color:#a0a7b5}
.plan li.no::before{content:"–";color:#a0a7b5}
.why{background:#fff5f5;border-left:6px solid var(--brand);border-radius:12px;padding:14px 18px;margin-bottom:22px}
.why b{color:var(--brand-d)}
.diff{background:#eef7f1;color:#0c6b36;border-radius:10px;padding:6px 12px;font-size:15px;font-weight:700;margin-bottom:10px}
.info{background:#fff;border:2px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:16px;font-size:16px}
details.card{margin-top:22px}
details summary{padding:16px 20px;font-weight:800;cursor:pointer;font-size:19px}
.cmp{width:100%;border-collapse:collapse;font-size:15px}
.cmp th,.cmp td{border:1px solid var(--line);padding:7px 10px;text-align:center}
.cmp th:first-child,.cmp td:first-child{text-align:left;background:#f8f9fb;font-weight:600}
.cmp .h-eco{background:var(--eco);color:#fff}.cmp .h-std{background:var(--std);color:#fff}.cmp .h-pre{background:var(--pre);color:#fff}
.cmp td.d-std{background:#e6f2f8}.cmp td.d-pre{background:#fdeaec}
.spot{margin-top:26px}
.spot h3{font-size:22px;margin-bottom:12px}
.benefit{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:14px}
.benefit div{background:var(--pre);color:#fff;border-radius:10px;padding:10px 14px;font-size:15px}
.benefit b{display:block;font-size:17px}
/* addons */
.addon{display:flex;gap:0;align-items:stretch}
.addon .pic{width:120px;height:auto;min-height:120px;flex:none;font-size:48px}
.addon .body{flex:1}
.addon .top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}
.tag{display:inline-block;background:var(--gold);color:#222;border-radius:6px;font-size:13px;font-weight:800;padding:1px 8px;margin-right:6px}
.toggle{border:3px solid var(--brand);color:var(--brand);background:#fff;border-radius:14px;min-height:60px;padding:0 26px;font:inherit;font-size:1rem;font-weight:800;cursor:pointer;white-space:nowrap;margin-top:6px}
.toggle.on{background:var(--ok);border-color:var(--ok);color:#fff}
select{font:inherit;font-size:.9rem;min-height:56px;padding:0 12px;border-radius:12px;border:2px solid var(--line);max-width:100%;margin-top:10px;background:#fff}
/* summary */
table.sum{width:100%;border-collapse:collapse}
.sum td,.sum th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left}
.sum td.r,.sum th.r{text-align:right}
.sum .total td{font-size:26px;font-weight:800;border-bottom:0;background:#fff5f5}
.fine{color:var(--sub);font-size:14px;margin-top:12px}
.fine li{margin-left:18px}
.startrow{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mpack{flex:1;min-width:380px;background:#fff;border-radius:var(--r);border-left:8px solid var(--brand);box-shadow:0 2px 10px rgba(20,30,50,.07);padding:14px 24px;position:relative}
.mpack .mtag{display:inline-block;background:var(--brand);color:#fff;font-size:.75rem;font-weight:800;border-radius:999px;padding:1px 14px;margin-bottom:4px}
.mpack p{font-size:.95rem;line-height:1.7}
.mpack b{color:var(--brand);font-size:1.15rem}
.mpack b.big{font-size:1.3rem}
.fine.notes p{margin:4px 0;padding-left:2.2em;text-indent:-2.2em}
/* 法定費用の確定 */
.legal{margin-bottom:20px}
.lg{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px}
.lg>b{width:7em}
.segs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1}
.seg{font:inherit;font-weight:800;border:3px solid var(--line);background:#fff;border-radius:14px;min-height:64px;padding:6px 20px;cursor:pointer;text-align:left;line-height:1.3}
.seg small{display:block;font-weight:500;color:var(--sub);font-size:.75rem}
.seg.on{border-color:var(--brand);background:#fff3f3}
.xin{font-weight:800}
.xin input{font:inherit;min-height:60px;width:150px;text-align:right;padding:0 12px;border:2px solid var(--line);border-radius:12px;margin-left:4px}
.okb{background:var(--ok);color:#fff;border-radius:999px;font-size:.7rem;padding:2px 12px;vertical-align:.1em}
/* 自由入力 */
.free{margin-top:22px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.qchip{font:inherit;font-size:.85rem;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:999px;min-height:48px;padding:0 18px;cursor:pointer}
.qchip:active,.qchip:hover{border-color:var(--brand);color:var(--brand-d)}
.frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.frow input{font:inherit;font-size:1rem;min-height:60px;padding:0 16px;border:2px solid var(--line);border-radius:12px}
.frow #cname{flex:1;min-width:260px}
.frow #cprice{width:180px;text-align:right}
.frow .yen{font-weight:800;font-size:1.2rem}
.del{white-space:nowrap;font:inherit;font-size:.8rem;font-weight:700;border:2px solid var(--line);background:#fff;border-radius:10px;min-height:44px;padding:0 14px;cursor:pointer;color:var(--sub)}
.est{text-align:center}
.bigp{font-size:3.2rem;font-weight:900;color:var(--brand);line-height:1.2}
.bigp small{font-size:1.4rem;color:var(--ink)}
/* 用語の解説ボタン・ポップアップ */
.term{font:inherit;color:var(--brand-d);font-weight:800;background:none;border:0;padding:0;cursor:pointer;border-bottom:2px dotted var(--brand);display:inline}
.term::after{content:"?";display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;margin-left:.3em;border-radius:50%;background:var(--brand);color:#fff;font-size:.75em;font-weight:900;vertical-align:.1em}
.modal{position:fixed;inset:0;background:rgba(10,12,18,.65);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.mbox{background:#fff;border-radius:24px;max-width:860px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mhead{background:linear-gradient(135deg,#14171f,#3a3f4b);color:#fff;padding:18px 28px;border-bottom:6px solid var(--brand);display:flex;align-items:center;gap:14px}
.mhead h3{font-size:1.4rem;flex:1}
.mbody{padding:22px 28px 26px}
.mbody .lead2{font-size:1.1rem;font-weight:700;margin-bottom:16px}
.msteps{display:flex;gap:10px;align-items:stretch;margin:16px 0}
.mstep{flex:1;background:#f4f5f7;border-radius:14px;padding:14px 12px;text-align:center;font-size:.85rem;font-weight:700}
.mstep span{display:block;font-size:2rem}
.msteps i{align-self:center;color:var(--brand);font-style:normal;font-size:1.4rem;font-weight:900}
.mbody ul{margin:8px 0 14px 1.3em}
.mbody li{margin:4px 0}
.mana{background:#fff5f5;border-left:6px solid var(--brand);border-radius:12px;padding:12px 16px;margin:12px 0}
.mclose{margin-top:6px;width:100%}
/* ===== スマホ最適化（縦向き） ===== */
@media (max-width:700px){
  html{font-size:16px}
  header{min-height:56px;padding:0 12px;gap:8px;border-bottom-width:4px}
  header h1{font-size:.8rem;line-height:1.2;min-width:0}
  header h1 img{height:38px;margin-right:8px;padding:2px 6px}
  header button{min-height:42px;padding:0 12px;font-size:.75rem;white-space:nowrap}
  main{padding:14px 14px 56px}
  h2{font-size:1.25rem;border-left-width:6px;padding-left:10px}
  .lead{font-size:.9rem;margin-bottom:14px}
  .hero{border-radius:14px;margin-bottom:16px}
  .startrow{flex-direction:column;align-items:stretch;gap:14px}
  .startrow .btn{width:100%;min-height:64px!important;padding:0 16px!important;font-size:1.1rem!important}
  .mpack{min-width:0;padding:12px 16px}
  .mpack p{font-size:.85rem}
  .mpack br{display:none}
  /* 進行バー：横スクロールにして1行に収める */
  .flow{flex-wrap:nowrap;overflow-x:auto;gap:4px;margin-bottom:16px;padding-bottom:4px;scrollbar-width:none}
  .flow::-webkit-scrollbar{display:none}
  .node{padding:5px 10px;font-size:.7rem;white-space:nowrap;flex:none}
  .arrow{font-size:.6rem;flex:none}
  /* 質問 */
  .opt{min-height:64px;padding:12px 16px;font-size:1rem;gap:12px;border-radius:16px}
  .opt .ic{font-size:1.8rem}
  .vg{grid-template-columns:1fr;gap:14px}
  .vhead{padding:10px 14px}
  .vhead svg{width:84px;height:42px}
  .vhead b{font-size:1rem}
  .vbtns{padding:10px;gap:8px}
  .gopt{min-height:56px;padding:8px 14px}
  .gopt .gb{width:32px;height:32px;font-size:.85rem}
  /* プラン：おすすめを先頭に */
  .plans{grid-template-columns:1fr;gap:14px}
  .plan.rec{transform:none;order:-1}
  .plan .price{font-size:1.9rem}
  .why{padding:10px 14px;margin-bottom:14px;font-size:.9rem}
  .btn{min-height:56px;padding:0 20px;font-size:1rem;width:100%}
  .back{width:100%}
  .chip{font-size:.8rem}
  details summary{font-size:1rem;padding:14px 16px}
  .cmp{font-size:.75rem}
  .cmp th,.cmp td{padding:5px 6px;white-space:nowrap}
  .spot h3{font-size:1.1rem}
  .benefit{grid-template-columns:1fr 1fr}
  /* 概算 */
  .bigp{font-size:2.3rem}
  .bigp small{font-size:1rem}
  .sum td,.sum th{padding:10px 8px;font-size:.85rem}
  .sum .total td{font-size:1.1rem}
  .addon .pic{min-height:64px;font-size:2.2rem}
  .toggle{width:100%;margin-top:10px}
  .addon .top>div:last-child{text-align:left!important;width:100%}
  .row{flex-direction:column;align-items:stretch}
  /* 用語ポップアップ */
  .modal{padding:10px;align-items:flex-end}
  .mbox{border-radius:20px 20px 12px 12px;max-height:90vh}
  .mhead{padding:12px 16px}
  .mhead h3{font-size:1.1rem}
  .mbody{padding:14px 16px 18px}
  .mbody .lead2{font-size:.95rem}
  .msteps{flex-direction:column}
  .msteps i{transform:rotate(90deg);align-self:center}
}
@media print{.modal{display:none!important}}
@media print{header,.row,.back,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none;border:1px solid #ccc}}
@media (max-width:640px){.addon{flex-direction:column}.addon .pic{width:100%;min-height:80px}}
</style>
</head>

const JURYO = [{k:"w13",label:"13年未満",price:3800},{k:"w13p",label:"13年以上経過",price:4600},{k:"w18",label:"18年以上経過",price:5000}];
const legalPick = (list,sel,x) => !sel ? null : sel==="x" ? (x!==""&&Number(x)>=0 ? Math.round(Number(x)) : null) : list.find(o=>o.k===sel).price;
function legalInfo(){
  const j=legalPick(JIBAI,S.legal.j,S.legal.jx), w=legalPick(JURYO,S.legal.w,S.legal.wx);
  return {j, w, fixed:j!==null&&w!==null, amount:(j??JIBAI[0].price)+(w??JURYO[0].price)+INSPECT_FEE};
}
const planTotal = p => planPrice(p) + FEES.agency + legalInfo().amount;
const planById = id => PLANS.find(p=>p.id===id);
const addonOpt = a => { const os=a.opts(), k=S.sel[a.id]||a.def(); return os.find(o=>o.k===k)||os[0]; };

function pic(icon,img,cls=""){
  return `<div class="pic ${cls}">${img?`<img src="${img}" alt="" onerror="this.remove()">`:""}<span>${icon}</span></div>`;
}
function scoreResult(){
  const tot={eco:0,std:0,pre:0};
  S.answers.forEach((a,i)=>{ const o=QUESTIONS[i].opts[a]; Object.entries(o.s||{}).forEach(([k,v])=>tot[k]+=v); });
  return ["eco","std","pre"].sort((a,b)=>tot[b]-tot[a]||PI[b]-PI[a])[0];
}
const reasons = () => S.answers.map((a,i)=>QUESTIONS[i].opts[a].why).filter(Boolean);
function flags(){
  const t=S.answers.map((a,i)=>QUESTIONS[i].opts[a].t).join("|");
  return {heavy:/5,000km以上|長距離/.test(t), idle:/乗っていない/.test(t)};
}
const specText = () => { const c=CATS[S.spec.cat]; return `${c.name}${c.d?`（${c.d}）`:""}／${S.spec.origin==="imp"?"外国車":"国産車"}`; };

/* ---------- 画面 ---------- */
function flowBar(){
  const n=QUESTIONS.length;
  let h='<div class="flow">';
  for(let i=0;i<n;i++){
    const c = S.screen==="flow" ? (i<S.step?"done":i===S.step?"now":"") : "done";
    h+=`<span class="node ${c}">Q${i+1}</span><span class="arrow">▶</span>`;
  }
  h+=`<span class="node ${S.screen==="plans"?"now":["addons","summary"].includes(S.screen)?"done":""}">おすすめ</span><span class="arrow">▶</span>`;
  h+=`<span class="node ${S.screen==="summary"?"now":""}">概算</span></div>`;
  return h;
}

/* ---------- 概算画面を画像（PNG）にして保存 ---------- */
function estimateData(){
  const p=planById(S.plan), a=ADDONS.find(x=>x.id==="refresh"), o=addonOpt(a), on=S.addons.has(a.id);
  const L=legalInfo(), total=planTotal(p)+(on?o.price:0);
  const rows=[
    [p.name+"（整備料・法定点検含む）", yen(planPrice(p))],
    ["車検代行費用", yen(FEES.agency)],
    ["法定費用（自賠責・重量税・検査手数料）", yen(L.amount)+"〜"]
  ];
  if(on) rows.push([a.name+"（"+o.label+"）", yen(o.price)]);
  return {p,total,rows};
}
function saveEstimateImage(){
  const {p,total,rows}=estimateData();
  const W=1080, PAD=64, FONT='"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif';
  const notes=["表示は概算です。法定費用（自賠責保険・重量税）は、保険の残り期間や車両の年式によって変わります。",
    "エンジンオイル・ブレーキフルード以外の部品代は別途必要です。","正確な金額は、店舗スタッフがご案内します。"];
  const cv=document.createElement("canvas"), ctx=cv.getContext("2d");
  const wrap=(text,font,maxW)=>{ ctx.font=font; const out=[]; let line="";
    for(const ch of text){ if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch;} else line+=ch; }
    if(line) out.push(line); return out; };
  /* 高さを先に計算 */
  const rowLines=rows.map(r=>wrap(r[0],`600 32px ${FONT}`,W-PAD*2-260));
  const noteLines=notes.map(n=>wrap("・"+n,`26px ${FONT}`,W-PAD*2));
  const rowsH=rowLines.reduce((s,l)=>s+Math.max(1,l.length)*42+36,0);
  const notesH=noteLines.reduce((s,l)=>s+l.length*38+6,0);
  const H=150+70+60+60+190+40+rowsH+110+40+notesH-30;
  cv.width=W; cv.height=H;
  const draw=(logo)=>{
    ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#14171f"; ctx.fillRect(0,0,W,130);
    ctx.fillStyle="#e60012"; ctx.fillRect(0,130,W,8);
    if(logo){ const lh=84, lw=logo.width/logo.height*lh;
      ctx.fillStyle="#fff"; ctx.beginPath(); ctx.roundRect?ctx.roundRect(PAD-12,23,lw+24,lh+10,12):ctx.rect(PAD-12,23,lw+24,lh+10); ctx.fill();
      ctx.drawImage(logo,PAD,28,lw,lh);
      ctx.fillStyle="#fff"; ctx.font=`700 36px ${FONT}`; ctx.textBaseline="middle"; ctx.fillText("車検 概算",PAD+lw+40,70);
    }
    let y=138+60; ctx.textBaseline="alphabetic";
    ctx.fillStyle="#5b6474"; ctx.font=`28px ${FONT}`; ctx.fillText(`${specText()}　｜　${new Date().toLocaleDateString("ja-JP")}`,PAD,y); y+=62;
    ctx.fillStyle="#14171f"; ctx.font=`700 40px ${FONT}`; ctx.fillText(p.name,PAD,y); y+=40;
    /* 概算金額 */
    ctx.fillStyle="#fff3f3"; ctx.fillRect(PAD,y,W-PAD*2,170);
    ctx.fillStyle="#e60012"; ctx.fillRect(PAD,y,10,170);
    ctx.textAlign="center"; ctx.fillStyle="#e60012"; ctx.font=`900 88px ${FONT}`;
    ctx.fillText("約 "+yen(total)+"〜",W/2,y+105);
    ctx.fillStyle="#5b6474"; ctx.font=`26px ${FONT}`; ctx.fillText("車検代行費用・法定費用を含む概算です",W/2,y+148);
    ctx.textAlign="left"; y+=170+50;
    /* 内訳 */
    rows.forEach((r,i)=>{
      ctx.fillStyle="#14171f"; ctx.font=`600 32px ${FONT}`;
      rowLines[i].forEach((ln,k)=>ctx.fillText(ln,PAD,y+k*42));
      ctx.textAlign="right"; ctx.fillText(r[1],W-PAD,y); ctx.textAlign="left";
      const h=Math.max(1,rowLines[i].length)*42;
      ctx.strokeStyle="#dfe3ea"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(PAD,y+h-8); ctx.lineTo(W-PAD,y+h-8); ctx.stroke();
      y+=h+36-8+8;
    });
    ctx.fillStyle="#fff3f3"; ctx.fillRect(PAD,y-10,W-PAD*2,80);
    ctx.fillStyle="#14171f"; ctx.font=`800 34px ${FONT}`; ctx.fillText("合計（概算）",PAD+16,y+44);
    ctx.textAlign="right"; ctx.fillStyle="#e60012"; ctx.font=`900 40px ${FONT}`; ctx.fillText("約 "+yen(total)+"〜",W-PAD-16,y+46); ctx.textAlign="left";
    y+=70+60;
    ctx.fillStyle="#5b6474"; ctx.font=`26px ${FONT}`;
    noteLines.forEach(ls=>{ ls.forEach(ln=>{ctx.fillText(ln,PAD,y);y+=38;}); y+=6; });
    cv.toBlob(blob=>showImageModal(blob,cv.toDataURL("image/png")),"image/png");
  };
  const img=document.querySelector("header h1 img");
  if(img&&img.complete){ const im=new Image(); im.onload=()=>draw(im); im.onerror=()=>draw(null); im.src=img.src; } else draw(null);
}
function showImageModal(blob,url){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="mbox"><div class="mhead"><span style="font-size:2rem">📷</span><h3>概算の画像</h3></div>
    <div class="mbody"><img src="${url}" alt="概算のお見積画像" style="width:100%;border:2px solid var(--line);border-radius:12px">
    <p class="fine" style="margin:10px 0">下の「保存」を押すか、画像を長押しして「画像を保存」を選んでください。</p>
    <button class="btn" id="imgsave">⬇ 保存する</button>
    <button class="btn ghost mclose" style="margin-top:10px">閉じる</button></div></div>`;
  const close=()=>m.remove();
  m.onclick=e=>{if(e.target===m)close();};
  m.querySelector(".mclose").onclick=close;
  m.querySelector("#imgsave").onclick=async()=>{
    const file=new File([blob],"bikeoh-shaken-estimate.png",{type:"image/png"});
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:"車検の概算"}); return; }
    }catch(e){ if(e&&e.name==="AbortError") return; }
    const a=document.createElement("a"); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  };
  document.body.appendChild(m);
}

function render(){
  ({home,flow,plans,summary})[S.screen]();
  window.scrollTo(0,0);
}
document.getElementById("home").onclick=document.getElementById("homeBtn").onclick=()=>{reset();render();};

/* ---------- 用語解説（クリックで表示） ---------- */
const GLOSSARY = {
  obd:{icon:"🩺", title:"OBD診断とは？",
    lead:"バイクの“健康診断”です。専用の機械をつないで、バイクの頭脳（コンピューター）に残っている異常の記録を読み取ります。",
    steps:[["🏍","バイクの頭脳（ECU）が燃料や点火などを電子制御しています"],["🔌","専用の診断機をつなぎます"],["📋","現在の異常と、過去の履歴を読み取ります"]],
    points:[
      "最近のバイクは、エンジンの燃料噴射や点火などをコンピューターで細かく制御しています。",
      "各部のセンサーが異常を見つけると、その記録がコンピューターに残ります。",
      "見た目や走った感じでは分からない不具合を、早めに見つけやすくなります。",
      "プレミアム車検では、現在の異常だけでなく過去の履歴も確認します。"],
    ana:"人間ドックで、普段の生活では気づけない体の不調を早めに見つけるのと同じイメージです。",
    note:"※車種によっては診断に対応できない場合があります。その場合は点検費用から2,200円引きになります。"}
};
function openTerm(key){
  const g=GLOSSARY[key]; if(!g) return;
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true">
    <div class="mhead"><span style="font-size:2.2rem">${g.icon}</span><h3>${g.title}</h3></div>
    <div class="mbody">
      <p class="lead2">${g.lead}</p>
      <div class="msteps">${g.steps.map((s,i)=>`${i?"<i>▶</i>":""}<div class="mstep"><span>${s[0]}</span>${s[1]}</div>`).join("")}</div>
      <ul>${g.points.map(p=>`<li>${p}</li>`).join("")}</ul>
      <div class="mana">💡 ${g.ana}</div>
      <p class="fine">${g.note}</p>
      <button class="btn mclose">閉じる</button>
    </div></div>`;
  const close=()=>{m.remove();document.removeEventListener("keydown",esc);};
  const esc=e=>{if(e.key==="Escape")close();};
  m.onclick=e=>{if(e.target===m)close();};
  m.querySelector(".mclose").onclick=close;
  document.addEventListener("keydown",esc);
  document.body.appendChild(m);
}
document.addEventListener("click",e=>{const t=e.target.closest("[data-term]"); if(t) openTerm(t.dataset.term);});
/* お客様用：一定時間操作がなければ最初の画面に戻る（店頭タブレット用） */
const IDLE_MS = 3*60*1000;
let idleTimer;
function armIdle(){
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ if(S.screen!=="home"){ document.querySelectorAll(".modal").forEach(m=>m.remove()); reset(); render(); } }, IDLE_MS);
}
["pointerdown","keydown","scroll"].forEach(ev=>document.addEventListener(ev,armIdle,{passive:true}));
armIdle();
render();
